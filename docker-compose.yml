services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: graphmentor
      POSTGRES_PASSWORD: graphmentor
      POSTGRES_DB: graphmentor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphmentor"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata:
